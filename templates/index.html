<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>壁纸剪裁 · Wallpaper Clip Studio</title>
<link rel="stylesheet" href="/static/studio.css">
</head>
<body>
<header class="topbar">
  <h1 class="brand">壁纸剪裁</h1>
  <span class="sub" data-i18n>把电影镜头剪成无缝循环的桌面动态壁纸</span>
  <button id="lang-toggle" class="btn ghost">EN</button>
</header>

<main class="wrap">
  <section class="card">
    <h2 data-i18n>1 · 选择片源</h2>
    <select id="src"></select>
    <div class="row">
      <button id="probe-btn" class="btn" data-i18n>探测规格</button>
      <span id="probe-out" class="muted"></span>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n>2 · 定位镜头</h2>
    <div class="row">
      <label data-i18n>起点(秒)</label><input id="start" type="number" step="0.001" value="6539.116">
      <label data-i18n>终点(秒)</label><input id="end" type="number" step="0.001" value="6543.954">
      <label data-i18n>起点模式</label>
      <select id="mode">
        <option value="scene" data-i18n>场景切割</option>
        <option value="audio_onset" data-i18n>台词声音出现处</option>
        <option value="fade_clean" data-i18n>渐变后干净帧</option>
        <option value="exact" data-i18n>精确边界</option>
      </select>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n>3 · 目标屏幕与取景</h2>
    <div class="row">
      <label data-i18n>设备</label><select id="device"></select>
      <button id="preview-btn" class="btn" data-i18n>预览取景</button>
    </div>
    <div id="previews" class="previews"></div>
  </section>

  <section class="card">
    <h2 data-i18n>4 · 生成壁纸</h2>
    <div class="row">
      <label data-i18n>任务名</label><input id="name" value="wallpaper">
      <label data-i18n>循环</label>
      <select id="loop">
        <option value="palindrome_dwell" data-i18n>回文+折返停顿</option>
        <option value="palindrome" data-i18n>回文</option>
        <option value="crossfade" data-i18n>交叉淡化</option>
      </select>
    </div>
    <div class="row" id="speeds">
      <label data-i18n>倍速</label>
      <label><input type="checkbox" value="1.0" checked> 1.0×</label>
      <label><input type="checkbox" value="0.75" checked> 0.75×</label>
      <label><input type="checkbox" value="0.5" checked> 0.5×</label>
      <label><input type="checkbox" value="0.25" checked> 0.25×</label>
    </div>
    <div class="row">
      <button id="run-btn" class="btn primary" data-i18n>开始生成</button>
      <span id="run-status" class="muted"></span>
    </div>
    <pre id="job-log" class="log"></pre>
  </section>

  <section class="card">
    <h2 data-i18n>5 · 成果</h2>
    <div class="row">
      <label data-i18n>保存目录</label><input id="save-dir" placeholder="~/Movies/Wallpapers" style="width:260px">
      <button id="refresh-btn" class="btn" data-i18n>刷新</button>
    </div>
    <div id="results" class="results"></div>
  </section>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
